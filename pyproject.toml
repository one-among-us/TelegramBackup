[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tgc"
description = "Telegram Channel Backup Crawler"
readme = "README.md"
authors = [
    { name = "Azalea Gui", email = "me@hydev.org" }
]
requires-python = ">=3.11"
keywords = ["telegram", "backup"]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "toml~=0.10.2",
    "kurigram~=2.2.26",
    "tgcrypto~=1.2.5",
    "requests~=2.34.2",
    "hypy_utils>=1.0.29",
    "pillow~=13.0.0",
    "feedgen~=1.0.0",
    "markdown~=3.11.2",
    'importlib-metadata~=10.1.0',
]
dynamic = ["version"]
urls = { Homepage = 'https://github.com/one-among-us/TelegramBackup' }

[tool.setuptools]
py-modules = ["tgc"]
packages = ['tgc']

[tool.setuptools.dynamic]
version = {attr = "tgc.__version__"}

[project.scripts]
tgc = "tgc.pyro.__main__:run"
tgce = "tgc.convert_export:run"
