name: Publish to PyPI and GitHub Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build, Publish to PyPI, and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to create GitHub Release and upload assets
      id-token: write       # Needed for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.ref_name }}" --pretty=format:"### %s (%h)%n%n%b" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> release_notes.md
          else
            git log -1 "${{ github.ref_name }}" --pretty=format:"### %s (%h)%n%n%b" >> release_notes.md
          fi
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file release_notes.md
